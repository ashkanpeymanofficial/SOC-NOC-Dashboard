<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود | SOC Center</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.1);
            animation: slideIn 0.5s ease;
        }
        .login-box h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-box p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            color: #050810;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }
        .error-msg {
            background: rgba(255, 51, 85, 0.1);
            border: 1px solid rgba(255, 51, 85, 0.3);
            color: var(--neon-red);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h1>🛡️ SOC CENTER</h1>
            <p class="subtitle">مرکز عملیات امنیتی - ورود به سیستم</p>
            
            <div class="error-msg" id="errorMsg"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="submitBtn">ورود به داشبورد</button>
            </form>
            <p style="text-align:center;color:var(--text-muted);font-size:11px;margin-top:20px;">
                کاربر پیش‌فرض: <b style="color:var(--neon-blue)">admin</b> / رمز: <b style="color:var(--neon-blue)">Admin@123</b>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.remove('show');
            btn.textContent = 'در حال ورود...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || 'خطا در ورود');
                }

                const data = await response.json();
                localStorage.setItem('soc_token', data.token);
                localStorage.setItem('soc_user', data.username);
                localStorage.setItem('soc_role', data.role);
                window.location.href = '/index.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.add('show');
                btn.textContent = 'ورود به داشبورد';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
